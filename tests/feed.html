<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .pool {
            background: white;
            border: 2px solid #444;
            border-radius: 10px;
            margin: 20px 0;
            padding: 20px;
        }

        .category {
            margin-top: 20px;
            border: 1px solid #bbb;
            border-radius: 8px;
            background: #fafafa;
            padding: 15px;
        }

        .post {
            margin-top: 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }

        .media {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        img {
            width: 200px;
            border-radius: 6px;
        }

        #loading {
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Feed Viewer</h1>

    <div id="loading">Loading...</div>
    <div id="app"></div>

    <script>

        const API_URL = "http://localhost:8000/feeds/posts"; // <-- CHANGE THIS

        async function loadFeed() {

            try {

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                render(data);

            } catch (err) {

                document.getElementById("loading").innerHTML =
                    `<span style="color:red;">${err}</span>`;

            }

        }

        function render(data) {

            document.getElementById("loading").remove();

            const app = document.getElementById("app");

            Object.entries(data.posts).forEach(([poolName, categories]) => {

                const pool = document.createElement("div");
                pool.className = "pool";

                pool.innerHTML = `<h2>📦 ${poolName}</h2>`;

                Object.entries(categories).forEach(([categoryName, posts]) => {

                    const category = document.createElement("div");
                    category.className = "category";

                    category.innerHTML = `<h3>📁 ${categoryName}</h3>`;

                    posts.forEach(post => {

                        const div = document.createElement("div");
                        div.className = "post";

                        div.innerHTML = `
                    <h4>${post.title}</h4>

                    <p>${post.body}</p>

                    <p><b>Score:</b> ${post.engagement_score}</p>
                    <p><b>Created:</b> ${new Date(post.created_at).toLocaleString()}</p>
                    <p><b>User:</b> ${post.user_id}</p>
                    <p><b>Category:</b> ${post.category_id}</p>
                `;

                        if (post.media?.length) {

                            const media = document.createElement("div");
                            media.className = "media";

                            post.media.forEach(item => {

                                if (item.media_type === "image") {

                                    const img = document.createElement("img");
                                    img.src = item.url;
                                    img.loading = "lazy";
                                    media.appendChild(img);

                                } else {

                                    const a = document.createElement("a");
                                    a.href = item.url;
                                    a.target = "_blank";
                                    a.innerText = item.url;
                                    media.appendChild(a);

                                }

                            });

                            div.appendChild(media);

                        }

                        category.appendChild(div);

                    });

                    pool.appendChild(category);

                });

                app.appendChild(pool);

            });

        }

        loadFeed();

    </script>

</body>

</html>
